name: Validate platform
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: savelanded_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/savelanded_test
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: isolated-ci-session-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:migrate
      - run: npm run test
      - run: npm run build
      - run: npm run test:prisma-tracing
      - run: npm run test:admin-runtime
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run start > /tmp/savelanded.log 2>&1 &
          ready=false
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 5 http://localhost:3000/api/health/ready > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Application/database readiness failed"
            exit 1
          fi
          npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
