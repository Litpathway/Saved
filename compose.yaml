services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: savelanded
      POSTGRES_USER: savelanded
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD for the local database}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - savelanded-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savelanded -d savelanded"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  savelanded-data:
